spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/ccp_db}
spring.datasource.username=${DATASOURCE_USERNAME:ccp_user}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html

# JWT (HS256). Use a strong secret in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
