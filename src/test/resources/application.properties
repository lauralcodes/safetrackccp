spring.datasource.url=jdbc:h2:mem:ccpdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (HS256) test secret (do not use in production)
app.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.jwt.ttl-seconds=3600

# Admin seeding (test-only)
ADMIN_USERNAME=test-admin
ADMIN_PASSWORD=test-admin-password

